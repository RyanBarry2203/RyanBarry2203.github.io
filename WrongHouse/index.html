<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wrong House | Ryan Barry</title>
    <meta name="description" content="Wrong House, a first-person paranormal heist by Ryan Barry. Play it in your browser.">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap">
    <style>
        :root { color-scheme: dark; --bone: #e1d9c7; --bulb: #ffd9a8; --sage: #8fa38a; --dim: #6f6a60; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; background: #040506; color: var(--bone); font: 500 14px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
        .stage { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, #10141a 0%, #040506 70%); }
        canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); background: #000; outline: none; }
        .loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #040506; transition: opacity 0.6s; }
        .loader.is-done { opacity: 0; pointer-events: none; }
        .lamp { position: relative; width: 120px; height: 150px; }
        .lamp__cord { position: absolute; left: 59px; top: 0; width: 2px; height: 70px; background: #3a3530; }
        .lamp__shade { position: absolute; left: 30px; top: 66px; width: 60px; height: 24px; border-radius: 30px 30px 4px 4px; background: #3d3126; }
        .lamp__bulb { position: absolute; left: 49px; top: 84px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff6e4, var(--bulb) 55%, rgba(255, 200, 140, 0) 75%); filter: drop-shadow(0 0 22px rgba(255, 200, 140, 0.8)); animation: flicker 4.2s infinite; }
        .lamp__pool { position: absolute; left: -20px; top: 98px; width: 160px; height: 60px; background: radial-gradient(ellipse at top, rgba(255, 210, 160, 0.18), transparent 70%); animation: flicker 4.2s infinite; }
        @keyframes flicker { 0%, 18%, 22%, 60%, 63%, 100% { opacity: 1; } 20%, 61.5% { opacity: 0.15; } 21% { opacity: 0.7; } }
        .loader__title { margin: 0; font: 700 3rem/1 "Rajdhani", "Arial Narrow", sans-serif; letter-spacing: 0.35em; padding-left: 0.35em; color: var(--bone); }
        .loader__line { margin: -8px 0 0; font-style: italic; color: var(--dim); }
        .loader__bar { width: 220px; height: 3px; background: rgba(225, 217, 199, 0.12); border-radius: 2px; overflow: hidden; }
        .loader__fill { width: 0; height: 100%; background: var(--bulb); transition: width 0.3s; }
        .loader__status { margin: 0; font: 600 0.75rem/1 ui-monospace, Consolas, monospace; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; }
        .loader__error { max-width: 46ch; text-align: center; color: #e2856f; display: none; }
        .loader.is-error .loader__error { display: block; }
        .loader.is-error .lamp__bulb, .loader.is-error .lamp__pool { animation: none; opacity: 0.1; }
        .back { position: fixed; top: 12px; left: 14px; z-index: 5; font: 600 0.75rem/1 ui-monospace, Consolas, monospace; letter-spacing: 0.12em; color: var(--dim); text-decoration: none; text-transform: uppercase; }
        .back:hover { color: var(--bulb); }
        .embedded .back { display: none; }
        @media (prefers-reduced-motion: reduce) { .lamp__bulb, .lamp__pool { animation: none; } }
    </style>
</head>
<body>
    <a class="back" href="../#paranormal">&larr; Ryan Barry</a>
    <div class="stage">
        <canvas id="unity-canvas" tabindex="-1" aria-label="Wrong House game"></canvas>
    </div>
    <div class="loader" role="status" aria-live="polite">
        <div class="lamp" aria-hidden="true">
            <div class="lamp__cord"></div>
            <div class="lamp__shade"></div>
            <div class="lamp__bulb"></div>
            <div class="lamp__pool"></div>
        </div>
        <p class="loader__title">WRONG HOUSE</p>
        <p class="loader__line">You came to rob it. Something already lives here.</p>
        <div class="loader__bar"><div class="loader__fill"></div></div>
        <p class="loader__status">Picking the lock 0%</p>
        <p class="loader__error"></p>
    </div>

    <script>
        // Lets the portfolio silence the game while it is scrolled out of view: every AudioContext the game creates
        // is tracked, then suspended or resumed on a message from the page this build is embedded in.
        (function () {
            var Native = window.AudioContext || window.webkitAudioContext;
            if (!Native) return;
            var contexts = [];
            function Tracked(options) {
                var context = new Native(options);
                contexts.push(context);
                return context;
            }
            Tracked.prototype = Native.prototype;
            window.AudioContext = window.webkitAudioContext = Tracked;
            window.addEventListener('message', function (event) {
                if (event.origin !== location.origin) return;
                if (event.data === 'portfolio:pause') contexts.forEach(function (context) { context.suspend(); });
                if (event.data === 'portfolio:resume') contexts.forEach(function (context) { context.resume(); });
            });
        })();
    </script>
    <script src="Build/WrongHouse.loader.js"></script>
    <script>
        (function () {
            if (window.self !== window.top) document.documentElement.classList.add('embedded');

            var canvas = document.getElementById('unity-canvas');
            var loader = document.querySelector('.loader');
            var status = document.querySelector('.loader__status');
            var fill = document.querySelector('.loader__fill');
            var error = document.querySelector('.loader__error');

            canvas.addEventListener('contextmenu', function (event) { event.preventDefault(); });
            canvas.addEventListener('pointerdown', function () { canvas.focus(); });

            function progress(value) {
                fill.style.width = Math.round(value * 100) + '%';
                status.textContent = 'Picking the lock ' + Math.round(value * 100) + '%';
            }
            progress(0);

            createUnityInstance(canvas, {
                dataUrl: 'Build/WrongHouse.data.unityweb',
                frameworkUrl: 'Build/WrongHouse.framework.js.unityweb',
                codeUrl: 'Build/WrongHouse.wasm.unityweb',
                streamingAssetsUrl: 'StreamingAssets',
                companyName: 'Ryan Barry',
                productName: 'Wrong House',
                productVersion: '1.0.0',
                showBanner: function (message, type) { if (type === 'error') console.error(message); else console.warn(message); }
            }, progress).then(function () {
                status.textContent = 'The door is open';
                loader.classList.add('is-done');
                canvas.focus();
            }).catch(function (message) {
                loader.classList.add('is-error');
                status.textContent = 'The door would not open';
                error.textContent = 'Wrong House needs a desktop browser with WebGL 2 (Chrome, Edge or Firefox). ' + message;
            });
        })();
    </script>
</body>
</html>
